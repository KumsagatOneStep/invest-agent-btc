[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pandas>=3.0,<4",
    "aiogram>=3.31,<4",
    "apscheduler>=3.10,<4",
    "anthropic>=1.15,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "respx>=0.23,<0.24", "ruff>=0.17,<0.18"]

[tool.setuptools]
packages = ["invest_agent", "invest_agent.data", "invest_agent.strategies", "invest_agent.backtest", "invest_agent.llm", "invest_agent.research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
