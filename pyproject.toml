[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pandas",
    "aiogram>=3,<4",
    "apscheduler>=3.10,<4",
    "anthropic",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.setuptools]
packages = ["invest_agent", "invest_agent.data", "invest_agent.strategies", "invest_agent.backtest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
